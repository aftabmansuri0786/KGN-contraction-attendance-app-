name: Build KGN Construction Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew (if present)
      run: chmod +x gradlew || true

    - name: Generate debug keystore for Android signing
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Run Unit Tests
      run: ./gradlew :app:testDebugUnitTest

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KGN-Construction-Attendance-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
